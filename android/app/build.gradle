plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'fr.bonzeai.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.bonzeai.companion'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
        ndk { abiFilters += ['arm64-v8a'] }
    }
    signingConfigs {
        debug { storeFile file(System.getenv('ANDROID_USER_HOME') ? System.getenv('ANDROID_USER_HOME') + '/debug.keystore' : System.getProperty('user.home') + '/.android/debug.keystore') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs('src/main/assets', layout.buildDirectory.dir('generated/bonzeAssets'))
    androidResources { noCompress += ['gguf'] }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
tasks.register('copyBonzeAssets', Copy) {
    from(rootProject.file('docs')) { into 'docs' }
    from(rootProject.file('core')) { into 'core' }
    into(layout.buildDirectory.dir('generated/bonzeAssets'))
}
tasks.named('preBuild').configure { dependsOn(tasks.named('copyBonzeAssets')) }

