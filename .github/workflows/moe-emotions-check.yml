name: Bonze embodied emotional council candidate
on:
  push:
    branches: [feature/moe-emotions-incarnees-v1]
    paths: ['core/**','android/**','docs/**','tests/**','scripts/**','.github/workflows/moe-emotions-check.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check-council:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check core/council.js
      - run: node --test tests/*.test.mjs
      - run: node scripts/train-experts.mjs
      - run: git diff --exit-code -- core/weights/expert-router-v1.json
      - name: Verify text interface and offline browser regressions
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/browser.mjs
  android-compile:
    needs: check-council
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare pinned local voice build dependencies
        run: bash scripts/fetch-piper.sh
      - name: Compile candidate Java/Kotlin and lint (not a release APK)
        run: gradle --no-daemon :androidApp:assembleDebug :androidApp:lintDebug
      - name: Verify offline-only manifest
        run: |
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump permissions "$APK" > permissions.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
