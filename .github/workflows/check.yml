name: Bonze AI tests
on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check core/bonze.mjs
      - run: node --check docs/app.js
      - run: node --check docs/sw.js
      - run: node --test tests/*.test.mjs
