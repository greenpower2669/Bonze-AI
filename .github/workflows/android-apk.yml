name: Bonze AI Android APK
on:
  push:
    branches:
      - feature/offline-bonsaiv1
    paths:
      - 'android/**'
      - 'docs/**'
      - 'core/**'
      - 'scripts/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's ubuntu-latest already includes Android cmdline-tools; avoid
      # setup-android@v3 trying to install removed legacy 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified GGUF model weights and license (build time only)
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --fail --location --retry 4 --retry-delay 3 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Compile installable debug APK
        run: gradle --no-daemon :androidApp:assembleDebug
      - name: Rename APK and check output
        run: |
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" Bonze-AI-v0.3.0-accessible-debug.apk
          test -s Bonze-AI-v0.3.0-accessible-debug.apk
          sha256sum Bonze-AI-v0.3.0-accessible-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bonze-AI-v0.3.0-accessible-debug
          path: Bonze-AI-v0.3.0-accessible-debug.apk
          if-no-files-found: error
      - name: Publish direct APK in prerelease (not main)
        if: github.ref == 'refs/heads/feature/offline-bonsaiv1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bonze-ai-v0.3.0-accessible"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Bonze-AI-v0.3.0-accessible-debug.apk --clobber
          else
            gh release create "$tag" Bonze-AI-v0.3.0-accessible-debug.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "🌱 Bonze AI 0.3.0 · Visage permanent et conversation locale" \
              --notes "Bonze AI 0.3.0 de test avec visage permanent, gros sous-titres, dialogue automatique sans Entrée sur Android local, arrêt manuel du micro, alternance STT/TTS français hors ligne si moteurs présents, modèle dense LFM2.5-230M et huit micro-experts. Aucune authentification propriétaire. La conversation reste à valider sur téléphone réel."
          fi
