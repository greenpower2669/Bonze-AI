name: Bonze AI Android APK
on:
  push:
    branches: [feature/offline-bonsaiv1, feature/bonze-032-repertoire-simule]
    paths: ['android/**','docs/**','core/**','tests/**','scripts/**','build.gradle','settings.gradle','gradle.properties','.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: bonze-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: node --test tests/*.test.mjs
      - run: python tests/test_piper_lexicon.py
      - name: Test native session lifecycle without Android services
        run: |
          mkdir -p /tmp/bonze-java
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/VoiceSession.java android/app/src/main/java/fr/bonzeai/companion/DialogueMemory.java android/app/src/main/java/fr/bonzeai/companion/SpeechPlan.java tests/VoiceSessionTest.java tests/DialogueMemoryTest.java tests/SpeechPlanTest.java tests/PendingStartTest.java android/app/src/main/java/fr/bonzeai/companion/PendingStart.java
          java -cp /tmp/bonze-java VoiceSessionTest
          java -cp /tmp/bonze-java DialogueMemoryTest
          java -cp /tmp/bonze-java SpeechPlanTest
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/AdminGate.java tests/AdminGateTest.java
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/PendingDocument.java tests/PendingDocumentTest.java
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/PiperAudio.java tests/PiperAudioTest.java
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/PiperPhonetics.java tests/PiperPhoneticsTest.java
          java -cp /tmp/bonze-java PiperPhoneticsTest
          java -cp /tmp/bonze-java PiperAudioTest
          java -cp /tmp/bonze-java PendingDocumentTest
          java -cp /tmp/bonze-java AdminGateTest
          java -cp /tmp/bonze-java PendingStartTest
      - name: Install browser for integration checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify conversation, personalization, layout and offline cache
        env: {BONZE_SCREENSHOT: bonze-v060.png}
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bonze-ui-check, path: bonze-v060.png, if-no-files-found: ignore}
  android-debug:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reuse test signing key when cache is available
        uses: actions/cache@v4
        with:
          path: android/test-signing/debug.keystore
          key: bonze-ai-debug-signing-v2
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified GGUF model and license (build time only)
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Fetch pinned Piper runtime and French voice
        run: bash scripts/fetch-piper.sh
      - name: Audit speech coverage against the actual Piper lexicon
        run: node scripts/audit-piper-corpus.mjs
      - name: Compile APK and run Android lint
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/bonze-android-user
        run: |
          mkdir -p "$ANDROID_USER_HOME" android/test-signing
          if test -s android/test-signing/debug.keystore; then cp android/test-signing/debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi
          if ! test -s "$ANDROID_USER_HOME/debug.keystore"; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$ANDROID_USER_HOME/debug.keystore" android/test-signing/debug.keystore
          gradle --no-daemon :androidApp:assembleDebug :androidApp:lintDebug :androidApp:signingReport
          if test -s "$ANDROID_USER_HOME/debug.keystore"; then cp "$ANDROID_USER_HOME/debug.keystore" android/test-signing/debug.keystore; fi
      - name: Inspect compiled permission, version and signature
        run: |
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then exit 1; fi
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -q "name='fr.bonzeai.companion'" package.txt
          grep -q "versionName='0.6.0'" package.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -qi '128b1bb0d488f33dd9075888ee15d6ff943136d657018026d1e0b22d9c35991d' signature.txt
          cp "$APK" Bonze-AI-v0.6.0-debug.apk
          sha256sum Bonze-AI-v0.6.0-debug.apk | tee Bonze-AI-v0.6.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Bonze-AI-v0.6.0-debug
          path: |
            Bonze-AI-v0.6.0-debug.apk
            Bonze-AI-v0.6.0.sha256
            permissions.txt
            package.txt
            signature.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error

  android-offline-test:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - run: bash scripts/fetch-piper.sh
      - name: Build x86 test APKs (same speech/controller source)
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/bonze-emulator-key
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 100 -dname "CN=Bonze Emulator Test,O=Bonze,C=FR"
          gradle --no-daemon -PbonzeTestAbi=x86_64 :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install "$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
            adb install "$(find android/app/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)"
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            adb logcat -c
            adb shell am instrument -w fr.bonzeai.companion.test/androidx.test.runner.AndroidJUnitRunner | tee android-offline-test.txt
            adb logcat -d > android-logcat.txt
            tail -150 android-logcat.txt
            grep -q 'OK (3 tests)' android-offline-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonze-android-offline-test
          path: |
            android-offline-test.txt
            android-logcat.txt

  publish-test-release:
    needs: [android-debug, android-offline-test]
    if: github.ref == 'refs/heads/feature/offline-bonsaiv1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: Bonze-AI-v0.6.0-debug, path: release-files}
      - name: Publish direct APK after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          voice_check="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "Bonze Piper compatibility probe")] | sort_by(.run_number) | last | .conclusion')"
          test "$voice_check" = success || { echo 'Piper phonetic/intelligibility probe must pass at this exact commit before publication.'; exit 1; }
          cd release-files
          sha256sum -c Bonze-AI-v0.6.0.sha256
          tag="bonze-ai-v0.6.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            test "$existing" = "$GITHUB_SHA" || { echo 'Version already published at another commit; increment version.'; exit 1; }
            exit 0
          fi
          gh release create "$tag" Bonze-AI-v0.6.0-debug.apk Bonze-AI-v0.6.0.sha256 signature.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "🌱 Bonze AI 0.6.0 · Piper et conseil émotionnel · version de test" \
            --notes-file ../docs/release-v0.6.0.md
