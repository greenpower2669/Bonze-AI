name: Bonze AI Android APK
on:
  push:
    branches: [feature/offline-bonsaiv1]
    paths: ['android/**','docs/**','core/**','tests/**','scripts/**','build.gradle','settings.gradle','gradle.properties','.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonze-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: node --test tests/*.test.mjs
      - name: Test native session lifecycle without Android services
        run: |
          mkdir -p /tmp/bonze-java
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/VoiceSession.java android/app/src/main/java/fr/bonzeai/companion/DialogueMemory.java android/app/src/main/java/fr/bonzeai/companion/SpeechPlan.java tests/VoiceSessionTest.java tests/DialogueMemoryTest.java tests/SpeechPlanTest.java tests/PendingStartTest.java android/app/src/main/java/fr/bonzeai/companion/PendingStart.java
          java -cp /tmp/bonze-java VoiceSessionTest
          java -cp /tmp/bonze-java DialogueMemoryTest
          java -cp /tmp/bonze-java SpeechPlanTest
          javac -d /tmp/bonze-java android/app/src/main/java/fr/bonzeai/companion/AdminGate.java tests/AdminGateTest.java
          java -cp /tmp/bonze-java AdminGateTest
          java -cp /tmp/bonze-java PendingStartTest
      - name: Install browser for integration checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify conversation, personalization, layout and offline cache
        env: {BONZE_SCREENSHOT: bonze-v050.png}
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bonze-ui-check, path: bonze-v050.png, if-no-files-found: ignore}
  android-debug:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Reuse test signing key when cache is available
        uses: actions/cache@v4
        with:
          path: android/test-signing/debug.keystore
          key: bonze-ai-debug-signing-v2
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Download verified GGUF model and license (build time only)
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Compile APK and run Android lint
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/bonze-android-user
        run: |
          mkdir -p "$ANDROID_USER_HOME" android/test-signing
          if test -s android/test-signing/debug.keystore; then cp android/test-signing/debug.keystore "$ANDROID_USER_HOME/debug.keystore"; fi
          if ! test -s "$ANDROID_USER_HOME/debug.keystore"; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$ANDROID_USER_HOME/debug.keystore" android/test-signing/debug.keystore
          gradle --no-daemon :androidApp:assembleDebug :androidApp:lintDebug :androidApp:signingReport
          if test -s "$ANDROID_USER_HOME/debug.keystore"; then cp "$ANDROID_USER_HOME/debug.keystore" android/test-signing/debug.keystore; fi
      - name: Inspect compiled permission, version and signature
        run: |
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then exit 1; fi
          "$AAPT" dump badging "$APK" | head -n 1 | tee package.txt
          grep -q "name='fr.bonzeai.companion'" package.txt
          grep -q "versionName='0.5.0'" package.txt
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          cp "$APK" Bonze-AI-v0.5.0-debug.apk
          sha256sum Bonze-AI-v0.5.0-debug.apk | tee Bonze-AI-v0.5.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Bonze-AI-v0.5.0-debug
          path: |
            Bonze-AI-v0.5.0-debug.apk
            Bonze-AI-v0.5.0.sha256
            permissions.txt
            package.txt
            signature.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
      - name: Publish direct APK in a versioned prerelease
        if: github.ref == 'refs/heads/feature/offline-bonsaiv1' && false # candidate under validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="bonze-ai-v0.5.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            test "$existing" = "$GITHUB_SHA" || { echo 'Version already published at another commit; increment version.'; exit 1; }
            exit 0
          fi
          gh release create "$tag" Bonze-AI-v0.5.0-debug.apk Bonze-AI-v0.5.0.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "🌱 Bonze AI 0.5.0 · Notre histoire continue écran éteint" \
            --notes-file docs/release-v0.5.0.md
