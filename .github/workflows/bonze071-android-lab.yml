name: BONZE-071 Android Lab 070 direct test APK
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonze071-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify JS narrative engine and Android lab wiring
        run: |
          node --test tests/bonze066.test.mjs tests/bonze067.test.mjs tests/bonze068.test.mjs tests/bonze069.test.mjs tests/bonze070.test.mjs tests/bonze071-lab.test.mjs
      - name: Install Android API 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch checked offline language model and license
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Fetch pinned offline Piper French assets and runtime
        run: bash scripts/fetch-piper.sh
      - name: Build Bonze Lab parallel-install APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/bonze071-android
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if test ! -s "$ANDROID_USER_HOME/debug.keystore"; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bonze Lab 070, O=Bonze AI, C=FR"
          fi
          gradle --no-daemon -PbonzeLab070 :androidApp:assembleDebug :androidApp:lintDebug
      - name: Verify APK package, files, signature and network isolation
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$apk" | head -n 1 | tee package.txt
          grep -q "name='fr.bonzeai.companion.lab070'" package.txt
          grep -q "versionCode='9'" package.txt
          grep -q "versionName='0.8.1-lab070'" package.txt
          "$AAPT" dump permissions "$apk" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          unzip -l "$apk" | grep -F 'assets/docs/scene-lab.js'
          unzip -l "$apk" | grep -F 'assets/core/scene-facts.js'
          unzip -l "$apk" | grep -F 'assets/core/scene-ledger.js'
          cp "$apk" Bonze-AI-v0.8.1-lab070.apk
          sha256sum Bonze-AI-v0.8.1-lab070.apk | tee Bonze-AI-v0.8.1-lab070.sha256
          sha256sum -c Bonze-AI-v0.8.1-lab070.sha256
      - name: Preserve files for recovery if GitHub Release is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonze071-internal-apk-recovery
          path: |
            Bonze-AI-v0.8.1-lab070.apk
            Bonze-AI-v0.8.1-lab070.sha256
            package.txt
            permissions.txt
            signature.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish standalone APK to separate TEST prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bonze-ai-v0.8.1-lab070"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "TEST tag already exists: refusing to alter a previous release"
            exit 1
          fi
          gh release create "$tag" Bonze-AI-v0.8.1-lab070.apk Bonze-AI-v0.8.1-lab070.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "🌱 Bonze Lab 070 · narration expérimentale · APK test" \
            --notes "Version de laboratoire installable à côté de Bonze AI. Ouvrir 🧪 BONZE-070 dans l'application pour tester un récit, une contradiction et une évolution temporelle. Conversation vocale habituelle non modifiée ; moteur de fiction expérimental, hors ligne, aucune mémoire personnelle enregistrée. APK de debug signée pour test, non Play Store."
      - name: Verify direct APK attached to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bonze-ai-v0.8.1-lab070"
          uri="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="Bonze-AI-v0.8.1-lab070.apk") | .browser_download_url')"
          test "$uri" = "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Bonze-AI-v0.8.1-lab070.apk"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="Bonze-AI-v0.8.1-lab070.apk") | [.name,.size,.download_count] | @tsv'
          printf 'Standalone direct APK: %s\n' "$uri"
