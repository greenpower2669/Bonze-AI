name: Bonze Piper compatibility probe
on:
  push:
    branches: [feature/offline-bonsaiv1]
    paths: ['android/**','docs/**','core/**','tests/**','scripts/**','build.gradle','settings.gradle','gradle.properties','.github/workflows/android-apk.yml','.github/workflows/piper-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch pinned French MLS speech, runtime and lexicon
        run: |
          bash scripts/fetch-piper.sh
          pip install sherpa-onnx==2.0.1 soundfile faster-whisper==1.2.0 requests==2.32.5
      - name: Synthesize production phonetic path and independently transcribe three phrases
        run: |
          python - <<'PYTHON'
          from faster_whisper import WhisperModel
          import pathlib,sherpa_onnx,soundfile as sf,re,time
          root=pathlib.Path('android/app/src/main/assets/piper')
          tts=sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=str(root/'voice.onnx'),tokens=str(root/'tokens.txt'),lexicon='',noise_scale=.333,noise_scale_w=.333),num_threads=2)))
          model=WhisperModel('base',device='cpu',compute_type='int8')
          dictionary={line.split(' || ',1)[0]:line.split(' || ',1)[1].replace(' ','') for line in (root/'lexicon.txt').read_text().splitlines()}
          phrases=['Bonjour, je suis ton petit compagnon. Tu veux jouer avec moi ?','Je suis calme et content. Tu peux me raconter une histoire ?','On joue ensemble et on imagine une forêt avec des dragons.']
          # Same preflight floor as PiperPhonetics.speechPhonemes; short words are not misreported as successful Piper speech.
          import re as regex
          source=pathlib.Path('android/app/src/main/java/fr/bonzeai/companion/PiperPhonetics.java').read_text()
          minimum=int(regex.search(r'MIN_SPEECH_CODEPOINTS=(\d+)',source).group(1))
          def phonemes(phrase):return ' '.join(dictionary[w] for w in re.findall(r"[^\W\d_]+",phrase.lower()))
          short=phonemes('Bonjour mon ami. Comment vas tu ?')
          assert len(short.replace(' ',''))<minimum
          print('FALLBACK_EXPECTED piper-short-unstable: Bonjour mon ami. Comment vas tu ?',flush=True)
          heard=[]
          for index,phrase in enumerate(phrases):
            # SpeechPlan.piperChunks keeps these bounded replies as a single segment.
            assert len(phrase)<=220
            phones=phonemes(phrase);assert len(phones.replace(' ',''))>=minimum
            cfg=sherpa_onnx.GenerationConfig();cfg.sid=0;cfg.speed=.98;cfg.phoneme_codepoints=[[ord(c) for c in phones]]
            begin=time.monotonic();audio=tts.generate(phrase,cfg);samples=audio.samples
            assert len(samples)>1000 and audio.sample_rate==22050
            peak=max(abs(x) for x in samples);assert peak>.00001
            gain=min(20,.6/peak);path=f'voice-{index}-production.wav'
            sf.write(path,[x*gain for x in samples],audio.sample_rate)
            print('PCM',index,'seconds',len(samples)/audio.sample_rate,'generationSeconds',time.monotonic()-begin,'gain',gain,flush=True)
            segments,info=model.transcribe(path,language='fr',beam_size=3)
            transcript=' '.join(s.text for s in segments).lower();heard.append(transcript)
            print('ASR_EXPECTED',phrase,flush=True);print('ASR_HEARD',index,transcript,flush=True)
          # Coarse regression guards, not a human-listening or naturalness evaluation.
          assert sum(w in heard[0] for w in ['petit','compagnon','jouer','moi'])>=3,heard[0]
          assert all(w in heard[1] for w in ['calme','content','histoire']),heard[1]
          assert sum(w in heard[2] for w in ['ensemble','imagine','forêt','dragon'])>=3,heard[2]
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonze-piper-mls-sample
          path: |
            voice-*.wav
            android/app/src/main/assets/piper/MODEL_CARD
            android/app/src/main/assets/piper/LEXICON_NOTICE
