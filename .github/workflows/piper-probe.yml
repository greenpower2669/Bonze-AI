name: Bonze Piper compatibility probe
on:
  push:
    branches: [feature/offline-bonsaiv1]
    paths: ['.github/workflows/piper-probe.yml','scripts/prepare-piper-mls.py','scripts/prepare-piper-lexicon.py']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Fetch pinned French MLS speech, runtime and lexicon
        run: |
          bash scripts/fetch-piper.sh
          pip install sherpa-onnx==2.0.1 soundfile faster-whisper==1.2.0 requests==2.32.5
      - name: Install reference phonemizer for build-only comparison
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng
      - name: Synthesize actual French PCM
        run: |
          python - <<'PYTHON'
          import pathlib,sherpa_onnx,soundfile as sf,time
          root=pathlib.Path('android/app/src/main/assets/piper')
          config=sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=str(root/'voice.onnx'),tokens=str(root/'tokens.txt'),lexicon=str(root/'lexicon.txt'),noise_scale=.333,noise_scale_w=.333),num_threads=2))
          tts=sherpa_onnx.OfflineTts(config);begin=time.monotonic()
          audio=tts.generate('bonjour, je suis ton petit compagnon. tu veux jouer avec moi ?',sherpa_onnx.GenerationConfig())
          assert len(audio.samples)>1000 and audio.sample_rate==22050 and max(abs(x) for x in audio.samples)>.01
          gain=min(20,.6/max(abs(x) for x in audio.samples))
          sf.write('Bonze-Piper-MLS-francais-essai.wav',[x*gain for x in audio.samples],audio.sample_rate)
          print('PCM',len(audio.samples),'rate',audio.sample_rate,'generationSeconds',time.monotonic()-begin,'peak',max(abs(x) for x in audio.samples))
          PYTHON
      - name: Independent local transcription of generated sample (diagnostic, no human-listening claim)
        run: |
          python - <<'PYTHON'
          from faster_whisper import WhisperModel
          import pathlib,sherpa_onnx,soundfile as sf,subprocess
          root=pathlib.Path('android/app/src/main/assets/piper')
          tts=sherpa_onnx.OfflineTts(sherpa_onnx.OfflineTtsConfig(model=sherpa_onnx.OfflineTtsModelConfig(vits=sherpa_onnx.OfflineTtsVitsModelConfig(model=str(root/'voice.onnx'),tokens=str(root/'tokens.txt'),lexicon=str(root/'lexicon.txt'),noise_scale=.333,noise_scale_w=.333),num_threads=2)))
          model=WhisperModel('base',device='cpu',compute_type='int8')
          text='Bonjour, je suis ton petit compagnon. Tu veux jouer avec moi ?'
          reference=subprocess.check_output(['espeak-ng','-q','-v','fr-fr','--ipa',text],text=True).strip()
          print('REFERENCE_PHONEMES',reference)
          for sid in [0,1,25,50]:
            for frontend in ['lexicon','reference']:
              cfg=sherpa_onnx.GenerationConfig();cfg.sid=sid
              if frontend=='reference':cfg.phoneme_codepoints=[[ord(c) for c in reference.replace('\n',' ')]]
              audio=tts.generate(text.lower(),cfg);samples=audio.samples;gain=min(20,.6/max(abs(x) for x in samples))
              path=f'voice-{sid}-{frontend}.wav';sf.write(path,[x*gain for x in samples],audio.sample_rate)
              segments,info=model.transcribe(path,language='fr',beam_size=3)
              print('ASR_HEARD',sid,frontend,len(samples)/audio.sample_rate,' '.join(s.text for s in segments),flush=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonze-piper-mls-sample
          path: |
            Bonze-Piper-MLS-francais-essai.wav
            voice-*.wav
            android/app/src/main/assets/piper/MODEL_CARD
            android/app/src/main/assets/piper/LEXICON_NOTICE
