name: BONZE-072 Liquid 1.2B native free dialogue APK
on:
  push:
    branches: [feature/bonze042-field-fixes]
    paths:
      - 'android/app/src/main/java/fr/bonzeai/companion/LocalModelStore.java'
      - 'android/app/src/main/java/fr/bonzeai/companion/BonzeInference.kt'
      - 'android/app/src/main/java/fr/bonzeai/companion/ConversationService.java'
      - 'android/app/src/main/java/fr/bonzeai/companion/MainActivity.java'
      - 'docs/scene-lab.js'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/style.css'
      - 'android/app/build.gradle'
      - 'tests/bonze072-model.test.mjs'
      - '.github/workflows/bonze072-liquid-12b-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bonze072-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify JS narrative engine and Android lab wiring
        run: |
          node --test tests/bonze066.test.mjs tests/bonze067.test.mjs tests/bonze068.test.mjs tests/bonze069.test.mjs tests/bonze070.test.mjs tests/bonze072-model.test.mjs
      - name: Install Android API 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch checked offline language model and license
        run: |
          mkdir -p android/app/src/main/assets/models
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Fetch official bundled Liquid 1.2B Q4 and LFM Open License
        run: |
          curl --fail --location --retry 4 \
            --output android/app/src/main/assets/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf \
            "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
          echo "b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5  android/app/src/main/assets/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf" | sha256sum -c
          curl --fail --location --retry 4 \
            --output android/app/src/main/assets/models/LFM_1_2B_LICENSE.txt \
            "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_1_2B_LICENSE.txt
      - name: Fetch pinned offline Piper French assets and runtime
        run: bash scripts/fetch-piper.sh
      - name: Build Bonze Lab parallel-install APK
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/bonze071-android
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          if test ! -s "$ANDROID_USER_HOME/debug.keystore"; then
            keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bonze Liquid 1.2B, O=Bonze AI, C=FR"
          fi
          gradle --no-daemon -PbonzeLab12b :androidApp:assembleDebug :androidApp:lintDebug
      - name: Verify APK package, files, signature and network isolation
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -s "$apk"
          AAPT="${ANDROID_HOME}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$apk" | head -n 1 | tee package.txt
          grep -q "name='fr.bonzeai.companion.lab12b'" package.txt
          grep -q "versionCode='9'" package.txt
          grep -q "versionName='0.8.2-lab12b'" package.txt
          "$AAPT" dump permissions "$apk" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then echo 'Unexpected INTERNET permission'; exit 1; fi
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          unzip -l "$apk" | grep -F 'assets/docs/scene-lab.js'
          unzip -l "$apk" | grep -F 'assets/core/scene-facts.js'
          unzip -l "$apk" | grep -F 'assets/core/scene-ledger.js'
          unzip -l "$apk" | grep -F 'assets/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf'
          unzip -l "$apk" | grep -F 'assets/models/LFM_1_2B_LICENSE.txt'
          cp "$apk" Bonze-AI-v0.8.2-lab12b.apk
          sha256sum Bonze-AI-v0.8.2-lab12b.apk | tee Bonze-AI-v0.8.2-lab12b.sha256
          sha256sum -c Bonze-AI-v0.8.2-lab12b.sha256
      - name: Preserve files for recovery if GitHub Release is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonze072-internal-apk-recovery
          path: |
            Bonze-AI-v0.8.2-lab12b.apk
            Bonze-AI-v0.8.2-lab12b.sha256
            package.txt
            permissions.txt
            signature.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish standalone APK to separate TEST prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bonze-ai-v0.8.2-lab12b"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "TEST tag already exists: refusing to alter a previous release"
            exit 1
          fi
          gh release create "$tag" Bonze-AI-v0.8.2-lab12b.apk Bonze-AI-v0.8.2-lab12b.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "🧠 Bonze Liquid 1.2B · dialogue libre local · APK test" \
            --notes "APK autonome de TEST : Liquid LFM2.5-1.2B Instruct Q4 intégré, vérifié SHA-256 au premier usage et sans Internet. Le dialogue vocal et texte utilise une génération courte et libre plutôt que seulement des répliques préparées ; retour au dialogue original en cas d'échec ou RAM insuffisante. Choix 230M disponible dans Options pour comparaison. Installation parallèle sans remplacement de Bonze. Ne pas utiliser pour des décisions sensibles. Signée debug, non Play Store."
      - name: Verify direct APK attached to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bonze-ai-v0.8.2-lab12b"
          uri="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="Bonze-AI-v0.8.2-lab12b.apk") | .browser_download_url')"
          test "$uri" = "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Bonze-AI-v0.8.2-lab12b.apk"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="Bonze-AI-v0.8.2-lab12b.apk") | [.name,.size,.download_count] | @tsv'
          printf 'Standalone direct APK: %s\n' "$uri"
