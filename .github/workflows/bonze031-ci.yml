name: Bonze 031 — experimental validation (no release)
on:
  push:
    branches: [feature/bonze031-dialogue-natural-v1, feature/bonze039-svc-personalisation-v1, feature/bonze040-dialogue-voice-diagnostics, feature/bonze041-conversation-audio-integration, feature/bonze042-field-fixes]
    paths: ['core/**', 'docs/**', 'tests/**', 'android/**', '.github/probes/bonze031.cpp', '.github/workflows/bonze031-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: JS and Java regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: node --test tests/*.test.mjs
      - name: Native dialogue and session tests
        run: |
          mkdir -p /tmp/bonze-jvm
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/DialogueMemory.java tests/DialogueMemoryTest.java
          java -cp /tmp/bonze-jvm DialogueMemoryTest
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/KnowledgeGuard.java tests/KnowledgeGuardTest.java
          java -cp /tmp/bonze-jvm KnowledgeGuardTest
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/ReplyQuality.java tests/ReplyQualityTest.java
          java -cp /tmp/bonze-jvm ReplyQualityTest
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/SynonymChoice.java tests/SynonymChoiceTest.java
          java -cp /tmp/bonze-jvm SynonymChoiceTest
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/IntentClassify.java tests/IntentClassifyTest.java
          java -cp /tmp/bonze-jvm IntentClassifyTest
          javac -d /tmp/bonze-jvm android/app/src/main/java/fr/bonzeai/companion/VoiceSession.java tests/VoiceSessionTest.java
          java -cp /tmp/bonze-jvm VoiceSessionTest
      - run: python tests/test_piper_lexicon.py

  browser:
    name: Accessible and offline UI, including encrypted memory
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
        env:
          BONZE_SCREENSHOT: bonze-evolution-test.png
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bonze031-browser-evidence, path: bonze-evolution-test.png, if-no-files-found: ignore}

  android-compile:
    name: Compile Android source (no APK publication)
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Fetch pinned Piper AAR and voice for dependency resolution
        run: bash scripts/fetch-piper.sh
      - name: Verify all scripted French phrases against packaged Piper lexicon
        run: node scripts/audit-piper-corpus.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: bonze041-piper-audit, path: piper-corpus-report.json, if-no-files-found: ignore}
      - name: Compile Kotlin and Java (no release, no signing)
        run: gradle --no-daemon :androidApp:compileDebugKotlin :androidApp:compileDebugJavaWithJavac
      - name: Verify no Internet permission in source
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then exit 1; fi

  android-package-check:
    name: Build and inspect experimental APK (no release, no APK artifact)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bonze-build]')
    needs: [unit, browser, android-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Install SDK and pinned original 230M GGUF
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          mkdir -p android/app/src/main/assets/models
          curl -fL --retry 4 --output android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf"
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  android/app/src/main/assets/models/LFM2.5-230M-Q4_K_M.gguf" | sha256sum -c
          curl -fL --retry 4 --output android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LICENSE"
          test -s android/app/src/main/assets/models/LFM_OPEN_LICENSE.txt
      - name: Fetch pinned Piper runtime/voice and prepare ephemeral test signature
        run: |
          bash scripts/fetch-piper.sh
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Bonze Experimental CI,O=Bonze,C=FR"
      - name: Build real APK and lint without publishing it
        run: |
          gradle --no-daemon :androidApp:assembleDebug :androidApp:lintDebug
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK" && test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1 | tee package.txt
          grep -q "name='fr.bonzeai.companion'" package.txt
          grep -q "versionCode='8'" package.txt
          grep -q "versionName='0.8.0-dev'" package.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee permissions.txt
          ! grep -q android.permission.INTERNET permissions.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee signature-ci.txt
          sha256sum "$APK" | tee package-sha256.txt
          echo "Build verified. Temporary test signature: this APK is not an updatable release and is NOT published."
      - name: Build a separate-install Bonze AI Dev APK (same features, isolated data)
        run: |
          gradle --no-daemon -PbonzeParallelInstall=true :androidApp:assembleDebug
          APK="$(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" Bonze-AI-v0.8.0-dev-parallel.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Bonze-AI-v0.8.0-dev-parallel.apk | head -n 1 | tee package-parallel.txt
          grep -q "name='fr.bonzeai.companion.dev'" package-parallel.txt
          grep -q "versionCode='8'" package-parallel.txt
          grep -q "versionName='0.8.0-dev'" package-parallel.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions Bonze-AI-v0.8.0-dev-parallel.apk | tee permissions-parallel.txt
          ! grep -q android.permission.INTERNET permissions-parallel.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Bonze-AI-v0.8.0-dev-parallel.apk | tee signature-parallel.txt
          sha256sum Bonze-AI-v0.8.0-dev-parallel.apk | tee Bonze-AI-v0.8.0-dev-parallel.sha256
      - name: Keep experimental APK accessible without GitHub Release
        uses: actions/upload-artifact@v4
        with:
          name: bonze-ai-0.8.0-dev-parallel-apk
          path: |
            Bonze-AI-v0.8.0-dev-parallel.apk
            Bonze-AI-v0.8.0-dev-parallel.sha256
            package-parallel.txt
            permissions-parallel.txt
            signature-parallel.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonze031-package-inspection
          path: |
            package.txt
            permissions.txt
            signature-ci.txt
            package-sha256.txt
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  github-apk-direct-release:
    name: Publish approved 0.8.0-dev APK as direct GitHub Release asset
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bonze041-conversation-audio-integration' && contains(github.event.head_commit.message, '[publish-bonze-080]')
    needs: [unit, browser, android-compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Get the already tested parallel APK (build 41201859372)
        uses: actions/download-artifact@v4
        with:
          name: bonze-ai-0.8.0-dev-parallel-apk
          run-id: 41201859372
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets
      - name: Verify exact APK bytes, checksum and absence of a previous tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-assets
          test -s Bonze-AI-v0.8.0-dev-parallel.apk
          test "$(stat -c '%s' Bonze-AI-v0.8.0-dev-parallel.apk)" = 271244969
          echo "dac8a4401e7a223d0982a7209d99a905dd6145fabbbf65da16db027394d20954  Bonze-AI-v0.8.0-dev-parallel.apk" | sha256sum -c
          sha256sum -c Bonze-AI-v0.8.0-dev-parallel.sha256
          grep -F "fr.bonzeai.companion.dev" package-parallel.txt
          grep -F "versionCode='8'" package-parallel.txt
          grep -F "versionName='0.8.0-dev'" package-parallel.txt
          ! grep -q "android.permission.INTERNET" permissions-parallel.txt
          grep -q "^Verifies$" signature-parallel.txt
          cd ..
          if gh release view bonze-ai-v0.8.0-dev-parallel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The release tag already exists. Refusing to overwrite."
            exit 1
          fi
      - name: Publish prerelease with direct .apk and checksum (no ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'NOTES'
          🌱 Bonze AI 0.8.0-dev — version de test parallèle pour Android.

          Installable à côté de Bonze 0.7.0-dev : identifiant distinct fr.bonzeai.companion.dev.
          VersionCode 8, versionName 0.8.0-dev.
          Dialogue local, répertoire émotionnel de 18 000 formulations, contrôle anti-répétition,
          correction audio Piper (flux continu), mémoire SVC et personnalisation,
          export JSON de diagnostics anonymisés.

          Le modèle et la voix sont embarqués ; aucune permission INTERNET.

          Signature de test temporaire : ce fichier APK n'est pas une mise à jour de Bonze 0.7 et
          les futures versions de cette variante peuvent ne pas accepter une mise à jour sur place.
          Conservez Bonze 0.7 et ses données. Faites une sauvegarde avant tout essai important.
          La qualité audio réelle doit encore être testée sur téléphone Samsung.

          Compilation vérifiée : https://github.com/greenpower2669/Bonze-AI/actions/runs/41201859372
          Branche de développement conservée, aucune fusion dans main.
          NOTES
          gh release create bonze-ai-v0.8.0-dev-parallel \
            release-assets/Bonze-AI-v0.8.0-dev-parallel.apk \
            release-assets/Bonze-AI-v0.8.0-dev-parallel.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target cd17a6bfd8ac07fd80cabf32c2ca989b900690be \
            --title "🌱 Bonze AI 0.8.0-dev — APK parallèle" \
            --notes-file release-notes.md \
            --prerelease

  compare-models:
    name: Optional CPU probe — 230M vs 1.2B (manual)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bonze-benchmark]')
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/llama
          key: bonze-llama-probe-2da6686
      - name: Build exact llama.cpp version from Bonze 0.6 dependency
        run: |
          if ! test -d /tmp/llama/.git; then git clone https://github.com/ggml-org/llama.cpp /tmp/llama; fi
          git -C /tmp/llama checkout 2da668617612d2df773f966e3b0ee22dc2beef7b
          cmake -S /tmp/llama -B /tmp/llama/build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama/build --target llama -j 4
          c++ -std=c++17 -I/tmp/llama/include -I/tmp/llama/ggml/include .github/probes/bonze031.cpp /tmp/llama/build/src/libllama.a /tmp/llama/build/ggml/src/libggml.a /tmp/llama/build/ggml/src/libggml-cpu.a /tmp/llama/build/ggml/src/libggml-base.a -fopenmp -lpthread -ldl -o /tmp/bonze031-probe
      - name: Evaluate current 230M, then release its weights
        run: |
          curl -fL --retry 4 "https://huggingface.co/LiquidAI/LFM2.5-230M-GGUF/resolve/main/LFM2.5-230M-Q4_K_M.gguf" -o /tmp/model.gguf
          echo "7bbd90384d3deffe4c646ec9643b212802d32d4ce417c90a1ec9282100650062  /tmp/model.gguf" | sha256sum -c
          /tmp/bonze031-probe /tmp/model.gguf "LFM2.5-230M Q4" > bonze-230m.jsonl
          rm /tmp/model.gguf
      - name: Evaluate alternative 1.2B; never load models simultaneously
        run: |
          curl -fL --retry 4 "https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf" -o /tmp/model.gguf
          echo "b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5  /tmp/model.gguf" | sha256sum -c
          /tmp/bonze031-probe /tmp/model.gguf "LFM2.5-1.2B Q4" > bonze-12b.jsonl
          rm /tmp/model.gguf
      - name: Produce non-qualitative diagnostics
        run: node scripts/score-dialogue.mjs bonze-230m.jsonl bonze-12b.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bonze031-comparison-raw
          path: |
            bonze-*.jsonl
            bonze031-diagnostics.md
          if-no-files-found: ignore
# One-time model comparison requested on the experiment branch; never publishes assets.

# BONZE-032: one-time opt-in benchmark after fixing mutable token and model switch (no release).

# BONZE-032: explicit one-time package validation after knowledge/memory fixes (no APK published).

# BONZE-041: separate test package built only with [bonze-build]; no Release, no in-place upgrade.
